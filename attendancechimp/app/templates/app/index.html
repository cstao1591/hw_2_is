<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            text-align: center; margin: 40px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Electronic class attendance tracking application, made for DATA 13600.</p>
    <p>{{current_time}}</p>
    {% if user.is_authenticated %}
        <p>Welcome, <b>{{ user.username }}</b>!</p>
    {% else %}
        <p>Not Logged In.</p>  <!-- shown otherwise -->
    {% endif %}
    
    <hr>

</div>
</body>
</html>
