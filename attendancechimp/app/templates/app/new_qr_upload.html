<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New QR Upload</title>
</head>
<body>
    <form action="/app/createQRCodeUpload" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
    <div>
        <!-- Always pair the input with an accessible label -->
        <label for="imageUpload">Choose file to upload:</label>
        <input type="file" id="imageUpload" name="imageUpload" />
    </div>
    
    <button type="submit">Upload QR code</button>
    </form>
</body>
</html>
